<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BYKU Mobile">
  <meta name="robots" content="noindex,nofollow">
  <title>BYKU.PUBLIKACJE MOBILE</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="loginScreen" class="login" hidden>
    <div class="login-box">
      <div class="logo"><span>B</span><div><strong>BYKU</strong><small>PUBLIKACJE · MOBILE</small></div></div>
      <h1>Zaloguj się</h1>
      <p class="muted">Materiały są dostępne wyłącznie po zalogowaniu.</p>
      <form id="loginForm" autocomplete="on">
        <label>Login<input id="loginInput" name="username" autocomplete="username" autocapitalize="none" required></label>
        <label>Hasło<input id="passwordInput" name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn primary big" type="submit" id="loginButton">Wejdź</button>
      </form>
      <p id="loginStatus" class="status" role="alert"></p>
    </div>
  </section>

  <div id="app" class="shell" hidden>
    <header class="top">
      <div class="logo small"><span>B</span><div><strong>BYKU</strong><small id="userLabel">MOBILE</small></div></div>
      <span id="netBadge" class="net">ONLINE</span>
      <button id="logoutButton" class="icon-btn" type="button" aria-label="Wyloguj" title="Wyloguj">⏻</button>
    </header>
    <div class="sync" id="syncBar">
      <button id="refreshButton" class="refresh" type="button">↻ Odśwież i sprawdź zgodność</button>
      <p id="syncStatus" class="sync-status" aria-live="polite"><b>Sprawdzam…</b></p>
    </div>
    <main>
      <div class="head-row">
        <div><p class="kicker">TIKTOK GOTOWY</p><h1>Instagram czeka</h1></div>
        <div class="seg" id="brandFilter" role="group" aria-label="Marka">
          <button type="button" data-brand="all">Wszystko</button><button type="button" data-brand="atlet">Atlet</button><button type="button" data-brand="rigger">Rigger</button>
        </div>
      </div>
      <div id="problems"></div>
      <div id="list" class="list"></div>
    </main>
  </div>

  <dialog id="detail" class="detail"><div id="detailBody"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
